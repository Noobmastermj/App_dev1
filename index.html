header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:5;box-shadow:0 2px 14px rgba(110,0,63,.3)}

.logo{width:42px;height:42px;border-radius:12px;border:2px solid rgba(255,255,255,.85);flex:none}
h1{font-size:19px;margin:0;font-weight:800;line-height:1.2}

h2{font-size:19px;margin:0 0 4px;font-weight:800}

main{max-width:980px;margin:0 auto;padding:16px 14px 24px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}

.panel{background:var(--surface);border-radius:18px;padding:18px;box-shadow:0 2px 14px rgba(60,20,45,.07)}
.hero{background:linear-gradient(145deg,#b8006c 0%,#7a0047 55%,#2a0018 100%);color:#fff;position:relative;overflow:hidden}

.hero>*{position:relative;z-index:1}
.hero .muted{color:rgba(255,255,255,.78)}
.hero .trk{background:#3ddc97!important}.hero .trk i{background:#ff5d6c!important}.hero .pk span[style]{color:#ffb3bb!important}
.hero .best{color:var(--gold)}
label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}
select,input[type=text],input[type=password],input[type=number],textarea{width:100%;background-color:var(--field);border:1.5px solid transparent;border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--brand);background-color:var(--surface)}
textarea{min-height:96px;resize:vertical}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;min-height:46px;letter-spacing:.02em}
.btn:active{transform:scale(.98)}
.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sm{padding:9px 14px;font-size:13px;min-height:38px;border-radius:10px}
.btn[data-act=send]{width:100%}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ticket{border-radius:14px;padding:14px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line)}
.ticket.urgent{border-left-color:var(--bad)}.ticket.high{border-left-color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.id{font-weight:800}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 11px;background:var(--soft);color:var(--brand)}
.muted{color:var(--muted);font-size:13px}
.note{border-bottom:1px solid var(--line);padding:10px 0}.note:last-child{border:0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.acts select{width:auto;min-width:200px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}

.tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

function overdue(t) {
  if (t.verification === "rejected" || t.status === "Completed" || t.status === "Resolved") return 0;
  const age = (Date.now() - new Date(t.created_at)) / 36e5, lim = t.verification === "pending" ? REVIEW_SLA : SLA[t.urgency];
  return age > lim ? age - lim : 0;
}
const prior = t => D.tickets.filter(x => x.id !== t.id && x.verification === "rejected" && ((t.device_id && x.device_id === t.device_id) || (t.contact && x.contact === t.contact))).length;
const STOP = new Set("the and for with from near this that have has had was were are been lost found item there here some very got can please yang dan di ke dari ini itu saya ada dengan untuk".split(" "));
const words = t => new Set((t.description + " " + (t.location || "")).toLowerCase().replace(/[^a-z0-9\u00c0-\u024f ]/g, " ").split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)));
function matches(t) {
  const mine = words(t), opp = t.category === "Lost item" ? "Found item" : "Lost item";
  return D.tickets.filter(x => x.id !== t.id && x.kind === "lost" && x.category === opp && x.verification !== "rejected" && x.status !== "Resolved").map(x => {
    const w = words(x); let n = 0; mine.forEach(k => { if (w.has(k)) n++; });
    return {x, n, sc: n + (t.store && t.store === x.store ? 2 : 0)};
  }).filter(m => m.n >= 1 && m.sc >= 2).sort((a, b) => b.sc - a.sc).slice(0, 3);
}
function csv(rows, cols) {

  return [cols.join(",")].concat(rows.map(r => cols.map(c => q(r[c])).join(","))).join("\r\n");
}

  });
}

async function addNote(id) {
  const ta = $("cm-" + id), body = ta ? ta.value.trim() : ""; if (!body) return;
  const {error} = await sb.from("comments").insert({ticket_id: +id, author_id: user.id, body, show_reporter: $("cs-" + id).checked});
  if (error) toast("Failed: " + error.message); else { openN.delete(+id); await reload(); render(); toast("Note saved"); }
}

/* ---------- Render and events ---------- */
async function render() {
  document.querySelectorAll("[data-act=view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === view));
  const ab = document.querySelector("[data-v=account]"); if (ab) ab.querySelector("span").textContent = user ? "Dashboard" : "Sign in";
  if (!sb) { $("app").innerHTML = SETUP; applyLang(); return; }
  if (view === "report") $("app").innerHTML = await reportView();
  else $("app").innerHTML = !user ? loginView() : role === "admin" ? adminView() : role === "tenant" ? "<div style='max-width:860px;margin:0 auto'>" + tenantView() + "</div>" : pendingView();
  applyLang();
}
document.addEventListener("click", async e => {
  if (e.target.id === "sheet") { $("sheet").classList.add("hidden"); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, t = D.tickets.find(x => String(x.id) === id);
  if (a === "view") { view = b.dataset.v; if (view === "account" && sb && !user) await checkRole(); render(); }
  else if (a === "send") send();
  else if (a === "login") login();
  else if (a === "signup") signup();
  else if (a === "logout") { await sb.auth.signOut(); user = null; role = "none"; profile = null; D = {tickets:[], techs:[], parking:[], profiles:[], admins:[], comments:[], activity:[], notices:[]}; render(); }
  else if (a === "refresh") { await reload(); render(); toast("Refreshed"); }
  else if (a === "claim" && user) { const {data, error} = await sb.rpc("claim_first_admin"); if (error) toast("Failed: " + error.message); else if (data) { await checkRole(); render(); toast("You are now the admin"); } else toast("An admin already exists. Ask them to approve you."); }
  else if (a === "togglenote") { const k = +id; if (openN.has(k)) openN.delete(k); else openN.add(k); render(); }
  else if (a === "addnote" && user) addNote(id);
  else if (a === "tresolve" && role === "tenant") { const {error} = await sb.rpc("tenant_resolve", {p_id: +id}); if (error) toast("Failed: " + error.message); else { await reload(); render(); toast("Marked as done"); } }
  else if (role !== "admin") return;
  else if (a === "approve") mut(sb.from("profiles").update({approved: true}).eq("user_id", id));
  else if (a === "revoke") mut(sb.from("profiles").update({approved: false}).eq("user_id", id));
  else if (a === "mkadmin") rpcAdmin("make_admin", id, "Admin added");
  else if (a === "rmadmin") { if (ask("Remove this admin?")) rpcAdmin("remove_admin", id, "Admin removed"); }
  else if (a === "rmuser") { if (ask("Remove this account? They will no longer be able to log in.")) rpcAdmin("delete_account", id, "Account removed"); }
  else if (a === "verify" && t) upd(t.id, {verification: "verified", urgency: {Normal: "High", High: "Urgent", Urgent: "Urgent"}[t.urgency], status: t.kind === "lost" ? "Verified" : t.status});
  else if (a === "reject" && t) upd(t.id, {verification: "rejected"});
  else if (a === "advance" && t) upd(t.id, {status: STAGES[STAGES.indexOf(t.status) + 1]});
  else if (a === "resolve" && t) upd(t.id, {status: "Resolved"});
  else if (a === "both" && t) { const o = b.dataset.b; mut(Promise.all([upd0(t.id), upd0(o)]).then(rs => rs.find(r => r.error) || {error: null})); }
  else if (a === "del" && t) { if (ask("Delete " + t.code + "? This cannot be undone.")) { const m = (t.photo_url || "").match(/report-photos\/(.+)$/); if (m) sb.storage.from("report-photos").remove([decodeURIComponent(m[1])]); mut(sb.from("tickets").delete().eq("id", t.id)); } }
  else if (a === "addtech") { const n = $("tn").value.trim(); if (n) mut(sb.from("technicians").insert({name: n, specialty: $("ts").value.trim()})); }
  else if (a === "deltech") { if (ask("Remove this technician?")) mut(sb.from("technicians").delete().eq("id", id)); }
  else if (a === "addlevel") { const n = $("pl").value.trim(), c = parseInt($("pc").value, 10); if (n && c >= 0) mut(sb.from("parking").insert({level: n, capacity: c, free: c})); }
  else if (a === "dellevel") { if (ask("Remove parking level " + id + "?")) mut(sb.from("parking").delete().eq("level", id)); }
  else if (a === "addnotice") { const ti = $("nt").value.trim(), d = parseInt($("nd").value, 10); if (ti) mut(sb.from("notices").insert({title: ti, body: $("nb").value.trim() || null, kind: $("nk").value, expires_at: d > 0 ? new Date(Date.now() + d * 864e5).toISOString() : null})); }
  else if (a === "delnotice") { if (ask("Delete this notice?")) mut(sb.from("notices").delete().eq("id", id)); }
  else if (a === "exp") download("aeon-reports-" + new Date().toISOString().slice(0, 10) + ".csv", csv(D.tickets, ["code","created_at","source","store","kind","category","location","description","contact","urgency","status","verification","technician","assigned_at","resolved_at","photo_url"]));
  else if (a === "expact") download("aeon-activity-" + new Date().toISOString().slice(0, 10) + ".csv", csv(D.activity, ["created_at","ticket_code","actor_email","action","detail"]));
});
const upd0 = id => sb.from("tickets").update({status: "Resolved", verification: "verified"}).eq("id", id);
document.addEventListener("change", async e => {
  const b = e.target, a = b.dataset ? b.dataset.act : null;
  if (role !== "admin") return;
  if (a === "assign" && b.value) upd(b.dataset.id, {technician: b.value, status: "Assigned", assigned_at: new Date().toISOString()});
  else if (a === "park") mut(sb.from("parking").update({free: Math.max(0, Math.min(+b.max, parseInt(b.value, 10) || 0)), updated_at: new Date().toISOString()}).eq("level", b.dataset.id));
});

/* ---------- Live updates ---------- */
let ch = null;
function subscribe() {
  if (!sb || ch) return; let tm;
  const go = () => { clearTimeout(tm); tm = setTimeout(live, 600); };
  ch = sb.channel("aeon-live"); ["tickets", "parking", "notices", "comments"].forEach(tb => ch.on("postgres_changes", {event: "*", schema: "public", table: tb}, go)); ch.subscribe();
}
async function live() {
  if (view === "report") await refreshPublic();
  else if ((role === "admin" || role === "tenant") && !typing()) { await reload(); render(); }
}
setInterval(() => { if (!typing()) live(); }, 30000);
(async () => { if (sb) { await checkRole(); subscribe(); } render(); })();

/* ---------- Theme, language and install button ---------- */
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function savedTheme() { try { return localStorage.getItem("aeon_theme"); } catch (e) { return null; } }
function isDark() { const t = savedTheme(); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function applyTheme() {
  const t = savedTheme(); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const d = isDark(), m = document.querySelector("meta[name=theme-color]"); if (m) m.content = d ? "#5a0035" : "#a3005f";
  const b = $("themebtn"); b.innerHTML = d ? SUN : MOON; b.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode");
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
applyTheme();
let dip = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), isAndroid = /android/i.test(navigator.userAgent);
function showInstall() { $("installbtn").classList.toggle("hidden", standalone() || !(dip || isIOS || isAndroid)); }
addEventListener("beforeinstallprompt", e => { e.preventDefault(); dip = e; showInstall(); });
addEventListener("appinstalled", () => { dip = null; showInstall(); toast("App installed"); });
showInstall();
function net() { $("offline").classList.toggle("hidden", navigator.onLine); }
addEventListener("online", () => { net(); render(); }); addEventListener("offline", net); net();
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act;
  if (a === "theme") { try { localStorage.setItem("aeon_theme", isDark() ? "light" : "dark"); } catch (x) {} applyTheme(); }
  else if (a === "lang") { LANG = LANG === "id" ? "en" : "id"; try { localStorage.setItem("aeon_lang", LANG); } catch (x) {} render(); }
  else if (a === "install") {
    if (dip) { dip.prompt(); await dip.userChoice; dip = null; showInstall(); }
    else {
      const en = isIOS ? ["Tap the <b>Share</b> button in Safari.", "Scroll down and tap <b>Add to Home Screen</b>.", "Tap <b>Add</b>."] : ["Tap the <b>three dots</b> menu in Chrome.", "Tap <b>Install app</b> or <b>Add to Home screen</b>.", "Tap <b>Install</b>."];
      const idn = isIOS ? ["Ketuk tombol <b>Bagikan</b> di Safari.", "Gulir ke bawah lalu ketuk <b>Tambah ke Layar Utama</b>.", "Ketuk <b>Tambah</b>."] : ["Ketuk menu <b>tiga titik</b> di Chrome.", "Ketuk <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.", "Ketuk <b>Instal</b>."];
      $("sheetbody").innerHTML = (LANG === "id" ? idn : en).map(x => "<li>" + x + "</li>").join(""); $("sheet").classList.remove("hidden"); applyLang();
    }
  } else if (a === "closesheet") $("sheet").classList.add("hidden");
});
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

</script>

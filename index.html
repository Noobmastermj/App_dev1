<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenant Maintenance Portal | AEON Mall BSD City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f5;--surface:#fff;--ink:#1d1a1c;--muted:#6b6468;--line:#e4dfe2;--brand:#b0105f;--brand-ink:#fff;--soft:#fbe8f1;--ok:#1b7a4b;--warn:#b86e00;--bad:#c0262d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171316;--surface:#221d21;--ink:#f3eef1;--muted:#a89fa4;--line:#3a3237;--brand:#e0488e;--brand-ink:#1a0711;--soft:#3a1c2c;--ok:#4cc58a;--warn:#f0a33a;--bad:#ff7075;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171316;--surface:#221d21;--ink:#f3eef1;--muted:#a89fa4;--line:#3a3237;--brand:#e0488e;--brand-ink:#1a0711;--soft:#3a1c2c;--ok:#4cc58a;--warn:#f0a33a;--bad:#ff7075;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
h1 small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
h2{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.ctl select{width:auto;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:700}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:6px 10px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.grid{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:820px){.grid.two{grid-template-columns:340px 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.muted{color:var(--muted);font-size:13px}
.ticket{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--surface)}
.ticket.urgent{border-left:5px solid var(--bad)}.ticket.high{border-left:5px solid var(--warn)}.ticket.normal{border-left:5px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.id{font-weight:800}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--soft);color:var(--brand)}
.badge.Completed{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.steps{display:flex;gap:4px;margin:10px 0 4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--brand)}
.steplabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts select{width:auto}
.note{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.note:last-child{border:0}
.bell{position:relative}
.dot{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;font-weight:700}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.stat b{display:block;font-size:22px}
.bars div{display:grid;grid-template-columns:90px 1fr 24px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bars span.b{height:10px;border-radius:5px;background:var(--brand);display:block}
img.ph{max-width:140px;border-radius:8px;margin-top:8px;display:block}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9}
.pick{position:relative;min-width:260px;max-width:100%;flex:1 1 260px}.pick input{width:100%}.res{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.18)}.res li{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.res li[data-id]:hover,.res li[aria-selected=true]{background:var(--soft)}.res small{color:var(--muted);white-space:nowrap}.res li.muted{cursor:default}
.hidden{display:none}
button{touch-action:manipulation}.toast{max-width:calc(100% - 24px);text-align:center}
@media(max-width:640px){header{position:static}.bar{padding:10px 12px;gap:10px}h1{font-size:16px}h2{font-size:18px}.ctl{width:100%;gap:8px}.seg{width:100%}.seg button{flex:1;padding:12px 8px;font-size:15px}.pick{flex:1 1 100%;min-width:0}.bell{flex:1 1 100%;min-height:44px}select,input[type=text],textarea{font-size:16px;padding:12px}.btn{padding:12px 16px;min-height:44px}.btn.sm{padding:10px 12px;font-size:14px;min-height:40px}.btn[data-act=submit]{width:100%}main{padding:14px 12px 40px}.panel{padding:14px}.acts select,.acts .btn{flex:1 1 100%;width:100%}.res{max-height:55vh}.res li{padding:12px 10px}.stat{grid-template-columns:repeat(2,1fr)}.stat b{font-size:20px}.steplabels{font-size:10px}.bars div{grid-template-columns:78px 1fr 20px}img.ph{max-width:100%}.dot{right:-2px}}
@media(prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<header><div class="bar">
<h1>Tenant Maintenance Portal<small>AEON Mall BSD City</small></h1>
<div class="ctl" id="top"></div>
</div></header>
<main id="app"></main>
<script>
(function(){

var RAW="180 SPM|GF;Ace Hardware|n/a;Adidas|GF;AEON BSD CITY Dept Store 1F|1F;AEON BSD CITY Dept Store 2F|2F;AEON BSD CITY Supermarket GF|GF;Asics|GF;ATM CENTER (3F)|3F;ATM CENTER (GF)|GF;Auntie Anne's|GF;B-Quik|GF;Baby Shop|2F;Bakmi Ayam Alok|3F;Bakmi GM|2F;Bakso Afung|3F;Bakso Malang Cak Rosso|3F;Ban ban|GF;Bank Mandiri|GF;BASGOR 89|3F;Bath & Body Works|GF;BCA|GF;Beard Papa|GF;Beatrice Clothing|2F;Beauty Scent|GF;Bellamama|GF;Beluga Jewellery|1F;Bijin Nabe|GF;Birkenstock|1F;Blibli|3F;BNI|GF;Bobo Tokyo|1F;Boost Juice|GF;Botanical Essentials|1F;BRANZ (Property)|GF;Bugatea|3F;Bugatea (2nd outlet)|3F;Bungeoppang|3F;Burger King|3F;Burger King|3MF;Buttonscarves|2F;C&F perfumery|GF;Calvin Klein|GF;Casio|1F;Chagee|GF;Charles & Keith|1F;Châteraisé|GF;Chatime|GF;CIMB Niaga Digital Lounge|GF;Cindy|2F;Cinema XXI|3F;Cold Stone|GF;Colorbox|2F;Converse|GF;COWAY|1F;Crocs|1F;D'Crepes|2F;Daniel Wellington|1F;Dapur Solo|2F;De Wasz Laundry|GF;Dear Butter|3F;Di Bawah Tangga|2F;Digimap|GF;Doner Kebab|3F;DORE by LeTAO|GF;Dough Lab|GF;Dparis|1F;Dum Dum Thai Tea|3F;Dwidaya Tour|3F;Edogawa Sushi|n/a;Eka Karya Orchid|GF;Eprise|2F;Erafone|3F;Erha Store|GF;Et Cetera|1F;Everbest|1F;Executive|1F;Expat Roasters|GF;Eyes Spice|1F;Facility|2F;Fan Fries|3F;Fat Duck|GF;Fitflop|1F;Flying Tiger Copenhagen|1F;Foot Locker|GF;Frank & Co|GF;Fruitylicious|3F;Garmin|1F;Ginza Nail|1F;Gion Sushi|GF;Giordano|1F;Glam On|2F;GMS BSD|1F;Gococo|3F;Golden Lamian|3F;Gramedia|2F;Greyhound|GF;GS Shop|2F;Guardian|GF;Guess|GF;Guldens Mice|3F;Gyukaku|GF;Gyukatsu Kyoto Katsugyu|GF;H&M|1F;Haagen-Dazs|3F;Haircode|2F;Happy Dental Clinic|n/a;Havaianas|1F;Huawei|3F;Hush Puppies|1F;I Love Emas|2F;Ice Gentong|3F;Ichiro|3F;Ikkudo Ichi|3F;Imperial Kitchen|3F;Iqos|GF;Itsu|3F;Jewel Cafe|1F;Jittlada Thai Cuisine|GF;Jolly Time|3F;Kaneko Hannosuke|GF;KFC|3F;KFC|3MF;Kiddycuts|2F;Kidz Station|2F;Kimukatsu|3F;Kluk Sandal|GF;Koi Cafe|1F;Kokuo Reflexology|3MF;Kopi Kenangan|1F;Krispy Kreme|GF;L'Occitane|GF;Lacoste|GF;Laxmi Tailor|1F;LEGO|1F;Levi's|1F;Lewis Emma|2F;Lock & Lock with Hello, Bebe|2F;Loly Poly|3F;Love, Bonito|1F;M&G Life|2F;Maison Tatsuya|GF;Mama Roz|1F;Mandalika Parfum|2F;Marco Chop Shop|2F;Max Fashions|2F;McDonald's|3F;Megane Prince|2F;Megaze Coffee|3F;Melissa|1F;Menya Sakura|3F;Mi Home|3F;Minoshe|2F;Miss Thai Boat Noodle|3F;Moo Chuu|2F;Mooimom|2F;Mothercare & Early Learning Center|2F;My Feet|2F;Nanny's Pavillon|GF;Nasgor Randang One|3F;Nespresso|GF;New Balance|GF;New Era|1F;Nike|GF;Noodle King|3F;Noodle King|3MF;Nuansa Musik|3MF;Oh! Some|2F;Ootoya|GF;Oppo|3F;Optik Melawai|1F;Optik Seis|1F;OWL Eyewear|2F;Owndays|2F;Pedro|1F;Pempek Hoi|3F;Pepperlunch|3F;Pho Baba|GF;Pika Piku Ice Cream|3F;Pizza Marzano|GF;Planet Sports. Asia|1F;Playtopia|3F;Playworks|3F;Pokemon Mezastar|3F;Polo|1F;Puyo|2F;Ramen Seirock-ya|3F;Rejuve|3F;Relx|1F;Remboelan|GF;Rempah Bistro|GF;Rockstar Academy|3F;Rokurenya|3F;Rujak Kolam Medan|3F;Sai Ramen|3F;Sate Padang Mak Syukur|3F;Saturdays|1F;Scandia|2F;Secret Garden|1F;Selfie Time|n/a;Sephora|1F;Shake Shake|3F;Shihlin Taiwan Street Snacks|GF;Shortcut Barbershop|2F;Shu Shu|3F;Simply|3F;Skechers|GF;Skin+|2F;Skinfood|GF;Smart Hand DIY|2F;Smiggle|2F;Social Affair|GF;Sociolla|GF;Soes Lelo|3F;Solaria|3F;Sop Ikan Batam|3F;Sop Konro Cendana|3F;Soto Betawi H. Mamat|3F;Staccato|1F;Starbucks Coffee|GF;Steak 21|3F;Steve Madden|1F;Stop n Go|GF;Sukiya|3F;Susu Mbok Darmi|3F;Taucy|3F;Tawan|3F;The Bath Box|GF;The Body Shop|GF;The Chicken Rice Shop|3F;The Palace|GF;The RR Chocolate|GF;This Is April|2F;Tiga Semut|3F;Tokio Sushi|3F;Tokyo Belle|3F;Tommy Hilfiger|GF;Toys City|2F;Umeda|2F;UNIQLO|1F;Urban & Co|2F;Urban Beats|3F;Vans|GF;Vines|GF;VIVAIA|1F;Wacoal|2F;Wardah|1F;Waroeng Teh Kotjok|3F;Watson|2F;White Noise|GF;YEN PAO|3F;Yole|GF;Yoshinoya|2F;Yves Rocher|GF;Zenbu|GF;Zoomoov|2F";
var TENANTS=RAW.split(";").map(function(x){var p=x.split("|");return{id:(p[0]+"-"+p[1]).toLowerCase().replace(/[^a-z0-9]+/g,"-"),name:p[0],unit:p[1]}});
var H=3600000,now=Date.now();
var S={role:"tenant",tenant:"starbucks-coffee-gf",seq:5,notes:[],tab:"main",
tickets:[
{id:"MR-2026-0001",t:"starbucks-coffee-gf",cat:"Air conditioning",desc:"AC blowing warm air during lunch peak.",urg:"Urgent",st:"In Progress",tech:"Siti",created:now-30*H,assigned:now-29*H},
{id:"MR-2026-0002",t:"uniqlo-1f",cat:"Lighting",desc:"Three spotlights flickering near the entrance.",urg:"Normal",st:"Assigned",tech:"Budi",created:now-20*H,assigned:now-17*H},
{id:"MR-2026-0003",t:"starbucks-coffee-gf",cat:"Plumbing",desc:"Slow leak under the kitchen sink.",urg:"High",st:"Submitted",tech:"",created:now-5*H,assigned:null},
{id:"MR-2026-0004",t:"starbucks-coffee-gf",cat:"Electrical",desc:"Socket by the cashier sparks when used.",urg:"Urgent",st:"Completed",tech:"Budi",created:now-70*H,assigned:now-69*H}
]};
try{var saved=localStorage.getItem("aeon-mr");if(saved){var p=JSON.parse(saved);if(p&&p.tickets&&tn(p.tenant)&&p.tickets.every(function(t){return tn(t.t)})){S=p}}}catch(e){}
function save(){try{localStorage.setItem("aeon-mr",JSON.stringify(S))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tn(id){return TENANTS.filter(function(t){return t.id===id})[0]}
function ago(ts){var h=Math.round((Date.now()-ts)/H);return h<1?"just now":h<48?h+" h ago":Math.round(h/24)+" d ago"}
function rank(u){return{Urgent:0,High:1,Normal:2}[u]}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function notify(tid,msg){S.notes.unshift({t:tid,msg:msg,at:Date.now(),read:false})}
function stepper(st){var i=STAGES.indexOf(st),h="<div class='steps' aria-hidden='true'>";STAGES.forEach(function(_,k){h+="<i class='"+(k<=i?"on":"")+"'></i>"});h+="</div><div class='steplabels'>";STAGES.forEach(function(s){h+="<span>"+s+"</span>"});return h+"</div>"}
function card(t,maint){
var te=tn(t.t),h="<div class='ticket "+t.urg.toLowerCase()+"'><div class='row'><span><span class='id'>"+t.id+"</span> <span class='badge "+t.st.replace(" ","")+"'>"+t.st+"</span></span><span class='muted'>"+ago(t.created)+"</span></div>";
h+="<div><b>"+esc(t.cat)+"</b> · "+t.urg+(maint?" · "+esc(te.name)+" ("+te.unit+")":"")+"</div><div>"+esc(t.desc)+"</div>";
if(t.photo)h+="<img class='ph' alt='Attached photo' src='"+t.photo+"'>";
h+=stepper(t.st);
h+="<div class='muted'>Technician: "+(t.tech||"not assigned yet")+"</div>";
if(maint&&t.st!=="Completed"){
h+="<div class='acts'>";
if(!t.tech){h+="<select data-id='"+t.id+"' data-act='assign' aria-label='Assign technician'><option value=''>Assign technician</option>"+TECH.map(function(x){return"<option>"+x.n+" ("+x.s+")</option>"}).join("")+"</select>"}
else{h+="<button class='btn sm' data-act='advance' data-id='"+t.id+"'>Mark "+STAGES[STAGES.indexOf(t.st)+1]+"</button>"}
h+="</div>"}
return h+"</div>"}
function notesPanel(tid){
var n=S.notes.filter(function(x){return x.t===tid});
return"<div class='panel'><h3>Notifications</h3>"+(n.length?n.slice(0,6).map(function(x){return"<div class='note'>"+esc(x.msg)+" <span class='muted'>"+ago(x.at)+"</span></div>"}).join(""):"<div class='muted'>Nothing yet. You will see updates here when a request changes status.</div>")+"</div>"}
function top(){
var h="<div class='seg' role='group' aria-label='Switch view'><button data-act='role' data-v='tenant' aria-pressed='"+(S.role==="tenant")+"'>Tenant</button><button data-act='role' data-v='maint' aria-pressed='"+(S.role==="maint")+"'>Maintenance</button></div>";
if(S.role==="tenant"){
var un=S.notes.filter(function(x){return x.t===S.tenant&&!x.read}).length;
h+="<div class='pick'><input type='text' id='q' autocomplete='off' placeholder='Search your store' aria-label='Search and select your store' value=\""+esc(tn(S.tenant).name+" ("+tn(S.tenant).unit+")")+"\"><ul id='res' class='res hidden' role='listbox'></ul></div>";
h+="<button class='btn alt sm bell' data-act='read'>Alerts"+(un?"<span class='dot'>"+un+"</span>":"")+"</button>"}
document.getElementById("top").innerHTML=h}
function tenantView(){
var mine=S.tickets.filter(function(t){return t.t===S.tenant}).sort(function(a,b){return b.created-a.created});
var te=tn(S.tenant);
var h="<div class='grid two'><div><div class='panel'><h2>Report a problem</h2><div class='muted'>"+esc(te.name)+", floor "+te.unit+"</div>";
h+="<label for='cat'>Category</label><select id='cat'>"+CATS.map(function(c){return"<option>"+c+"</option>"}).join("")+"</select>";
h+="<label for='urg'>How urgent is it?</label><select id='urg'><option>Normal</option><option>High</option><option>Urgent</option></select>";
h+="<label for='desc'>What is happening?</label><textarea id='desc' placeholder='Describe the problem and where it is in your store'></textarea>";
h+="<label for='ph'>Photo (optional)</label><input type='file' id='ph' accept='image/*'>";
h+="<div class='err' id='err' role='alert'></div><button class='btn' data-act='submit'>Submit request</button></div><div style='height:20px'></div>"+notesPanel(S.tenant)+"</div>";
h+="<div><h2>Your requests</h2><div class='muted'>Showing only requests from "+esc(te.name)+".</div>"+(mine.length?mine.map(function(t){return card(t,false)}).join(""):"<div class='panel' style='margin-top:10px'>No requests yet. Use the form to report your first problem.</div>")+"</div></div>";
return h}
function maintView(){
var all=S.tickets.slice().sort(function(a,b){var d=(a.st==="Completed")-(b.st==="Completed");return d||rank(a.urg)-rank(b.urg)||a.created-b.created});
var open=S.tickets.filter(function(t){return t.st!=="Completed"}).length;
var asg=S.tickets.filter(function(t){return t.assigned});
var avg=asg.length?asg.reduce(function(s,t){return s+(t.assigned-t.created)},0)/asg.length/H:0;
var counts={};S.tickets.forEach(function(t){counts[t.cat]=(counts[t.cat]||0)+1});
var mx=Math.max.apply(null,Object.keys(counts).map(function(k){return counts[k]}).concat([1]));
var h="<h2>Maintenance dashboard</h2><div class='muted' style='margin-bottom:12px'>Open requests are sorted by urgency, then by how long they have waited.</div>";
h+="<div class='stat'><div><b>"+open+"</b>Open requests</div><div><b>"+S.tickets.filter(function(t){return!t.tech}).length+"</b>Waiting for a technician</div><div><b>"+avg.toFixed(1)+" h</b>Average time to assign</div></div>";
h+="<div class='grid two'><div><h3>Requests by fault type</h3><div class='panel bars'>"+Object.keys(counts).map(function(k){return"<div><span>"+k+"</span><span><span class='b' style='width:"+(counts[k]/mx*100)+"%'></span></span><b>"+counts[k]+"</b></div>"}).join("")+"</div></div>";
h+="<div><h3>All requests</h3>"+all.map(function(t){return card(t,true)}).join("")+"</div></div>";
return h}
function render(){top();document.getElementById("app").innerHTML=S.role==="tenant"?tenantView():maintView();save()}
function submit(){
var d=document.getElementById("desc").value.trim(),err=document.getElementById("err");
if(d.length<10){err.textContent="Add a short description (at least 10 characters) so a technician knows what to bring.";return}
var f=document.getElementById("ph").files[0];
function add(photo){
var id="MR-2026-"+("000"+S.seq++).slice(-4);
S.tickets.push({id:id,t:S.tenant,cat:document.getElementById("cat").value,desc:d,urg:document.getElementById("urg").value,st:"Submitted",tech:"",created:Date.now(),assigned:null,photo:photo||""});
notify(S.tenant,id+" submitted. We will assign a technician shortly.");render();toast("Request "+id+" submitted")}
if(f&&f.size<400000){var r=new FileReader();r.onload=function(){add(r.result)};r.readAsDataURL(f)}
else if(f){err.textContent="Photo is too large. Choose an image under 400 KB.";return}
else add("")}
document.addEventListener("click",function(e){
var b=e.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act");
if(a==="role"){S.role=b.getAttribute("data-v");render()}
else if(a==="submit")submit();
else if(a==="read"){S.notes.forEach(function(n){if(n.t===S.tenant)n.read=true});render()}
else if(a==="advance"){var t=S.tickets.filter(function(x){return x.id===b.getAttribute("data-id")})[0];
t.st=STAGES[STAGES.indexOf(t.st)+1];notify(t.t,t.id+" is now "+t.st+".");render();toast(t.id+" marked "+t.st)}});
document.addEventListener("change",function(e){
var b=e.target,a=b.getAttribute("data-act");
if(a==="tenant"){S.tenant=b.value;render()}
else if(a==="assign"&&b.value){var t=S.tickets.filter(function(x){return x.id===b.getAttribute("data-id")})[0];
t.tech=b.value.split(" ")[0];t.st="Assigned";t.assigned=Date.now();notify(t.t,t.id+" assigned to "+t.tech+".");render();toast(t.id+" assigned to "+t.tech)}});
function list(q){var ul=document.getElementById('res');if(!ul)return;q=q.trim().toLowerCase();var m=TENANTS.filter(function(t){return !q||(t.name+' '+t.unit).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return a.name.localeCompare(b.name)});var h=m.slice(0,40).map(function(t,i){return '<li role="option" data-id="'+t.id+'"'+(i===0?' aria-selected="true"':'')+'>'+esc(t.name)+' <small>'+t.unit+'</small></li>'}).join('');if(!m.length)h='<li class="muted">No store found. Try a shorter name.</li>';if(m.length>40)h+='<li class="muted">'+(m.length-40)+' more stores. Keep typing to narrow the list.</li>';ul.innerHTML=h;ul.classList.remove('hidden')}
function choose(id){S.tenant=id;render()}
document.addEventListener('focusin',function(e){if(e.target.id==='q'){e.target.select();list('')}});
document.addEventListener('input',function(e){if(e.target.id==='q')list(e.target.value)});
document.addEventListener('focusout',function(e){if(e.target.id==='q'){setTimeout(function(){var q=document.getElementById('q');if(q&&document.activeElement!==q){var t=tn(S.tenant);q.value=t.name+' ('+t.unit+')'}},200)}});
document.addEventListener('keydown',function(e){if(e.target.id!=='q')return;var its=[].slice.call(document.querySelectorAll('#res li[data-id]')),i=its.findIndex(function(x){return x.getAttribute('aria-selected')==='true'});if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!its.length)return;var n=Math.max(0,Math.min(its.length-1,i+(e.key==='ArrowDown'?1:-1)));its.forEach(function(x){x.removeAttribute('aria-selected')});its[n].setAttribute('aria-selected','true');its[n].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();var s=its[Math.max(i,0)];if(s)choose(s.getAttribute('data-id'))}else if(e.key==='Escape'){document.getElementById('res').classList.add('hidden');e.target.blur()}});
document.addEventListener('click',function(e){var li=e.target.closest('li[data-id]');if(li){choose(li.getAttribute('data-id'));return}if(!e.target.closest('.pick')){var u=document.getElementById('res');if(u)u.classList.add('hidden')}});
render();
})();
</script>
</body>
</html>

async function checkRole() {
  const {data: {session}} = await sb.auth.getSession();
  user = session ? session.user : null; role = "none"; profile = null;
  if (!user) return;
  const a = await sb.from("admins").select("user_id").eq("user_id", user.id);
  if (a.data && a.data.length) { role = "admin"; await loadAdmin(); return; }
  const pr = await sb.from("profiles").select("*").eq("user_id", user.id);
  profile = (pr.data && pr.data[0]) || null; role = profile && profile.approved ? "tenant" : "pending";
  if (role === "tenant") await loadTenant();
}

function insights() {
  const T = D.tickets, wk = 7 * 864e5, mon = new Date(); mon.setHours(0, 0, 0, 0); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const weeks = []; for (let i = 7; i >= 0; i--) weeks.push({s: new Date(mon.getTime() - i * wk), n: 0});
  T.forEach(t => { const c = new Date(t.created_at); for (let i = weeks.length - 1; i >= 0; i--) if (c >= weeks[i].s) { weeks[i].n++; break; } });
  const mx = Math.max(1, ...weeks.map(w => w.n)), cats = {}; T.forEach(t => { cats[t.category] = (cats[t.category] || 0) + 1; });
  const top = Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 6), cm = Math.max(1, ...top.map(x => x[1]));
  const hrs = (a, b) => (new Date(b) - new Date(a)) / 36e5, avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;

    "<h3>Reports per week</h3><div class='chart'>" + weeks.map(w => "<div><span>" + w.n + "</span><i style='height:" + Math.max(2, Math.round(w.n / mx * 90)) + "px'></i><span>" + w.s.getDate() + "/" + (w.s.getMonth() + 1) + "</span></div>").join("") + "</div>" +
    "<h3 style='margin-top:18px'>Most common faults</h3>" + (top.length ? top.map(([k, v]) => "<div class='hb'><span>" + esc(k) + "</span><span class='b' style='width:" + Math.round(v / cm * 100) + "%'></span><b>" + v + "</b></div>").join("") : "<div class='muted'>No reports yet.</div>") + "</div>";
}

let io = null, dragEl = null, dragX = 0, dragL = 0, dragMoved = false;
function countUp(root) {
  root.querySelectorAll(".cnt").forEach(el => {
    const n = +el.dataset.n, t0 = performance.now();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || !n) { el.textContent = n.toLocaleString("en-US"); return; }
    const step = t => { const p = Math.min(1, (t - t0) / 1300), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(n * e).toLocaleString("en-US"); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function initReveal() {
  const els = document.querySelectorAll(".rvl:not(.in)");
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) { els.forEach(e => { e.classList.add("in"); countUp(e); }); return; }
  io = io || new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); countUp(en.target); } }), {threshold: .12});
  els.forEach(e => io.observe(e));
}
function initHome() {
  const sl = $("slider"); clearInterval(window.__sl); if (!sl) return;
  const dots = [...document.querySelectorAll("#sdots button")]; let cur = 0, paused = false, resume = null;
  const go = i => { cur = (i + dots.length) % dots.length; sl.scrollTo({left: sl.clientWidth * cur, behavior: "smooth"}); };
  sl.addEventListener("scroll", () => { const i = Math.round(sl.scrollLeft / sl.clientWidth); if (i !== cur) { cur = i; dots.forEach((d, k) => d.setAttribute("aria-current", k === cur)); } }, {passive: true});
  dots.forEach((d, k) => { d.onclick = () => go(k); });
  $("sprev").onclick = () => go(cur - 1); $("snext").onclick = () => go(cur + 1);
  const hold = () => { paused = true; clearTimeout(resume); resume = setTimeout(() => { paused = false; }, 9000); };
  ["pointerdown", "focusin", "input"].forEach(ev => sl.addEventListener(ev, hold)); sl.addEventListener("mouseenter", () => { paused = true; }); sl.addEventListener("mouseleave", () => { paused = false; });
